<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Briefing Deck — SlothRead</title>
  <meta name="description" content="Interactive executive briefing deck with 3 takeaways per chapter, interactive technical glossaries, and 60-second voice recaps.">
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js CDN (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D Interactive Torus Knot & Particle Background -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-container">
    <!-- Top Deck Navigation Header -->
    <header class="viewer-header">
      <div style="display: flex; align-items: center; gap: 20px;">
        <a href="index.html" class="brand-zone" title="Return to SlothRead Ingestion">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              <circle cx="9" cy="9" r="1.2" fill="currentColor"></circle>
              <circle cx="15" cy="15" r="1.2" fill="currentColor"></circle>
              <path d="M7 6l2 2m8-2l-2 2"></path>
            </svg>
          </div>
          <span class="brand-name">SlothRead</span>
        </a>

        <div style="height: 24px; width: 1px; background: var(--panel-border);"></div>

        <div class="viewer-doc-info">
          <div class="viewer-doc-title" id="deck-doc-title">Loading Document...</div>
          <div class="viewer-doc-meta" id="deck-doc-meta">Distilling chapters...</div>
        </div>
      </div>

      <div class="viewer-actions">
        <a href="index.html" class="btn-secondary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Synthesis
        </a>

        <button type="button" class="btn-primary" id="btn-export-md">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export Markdown
        </button>
      </div>
    </header>

    <!-- Main Presentation Deck Viewport -->
    <main class="deck-viewport" id="deck-viewport">
      <div class="glass-card slide-card active" style="text-align: center; padding: 60px 40px;">
        <h2 style="font-size: 1.5rem; margin-bottom: 12px;">Assembling Executive Briefing...</h2>
        <p style="color: var(--text-muted);">Parsing high-impact takeaways and technical definitions...</p>
      </div>
    </main>

    <!-- Bottom Presentation Controls -->
    <nav class="deck-bottom-bar" aria-label="Deck navigation">
      <div class="deck-nav-controls">
        <button type="button" class="nav-btn" id="prev-btn" title="Previous Slide (Left Arrow)" aria-label="Previous Slide">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <button type="button" class="nav-btn" id="next-btn" title="Next Slide (Right Arrow)" aria-label="Next Slide">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <div class="slide-dots-container" id="slide-dots-container">
          <!-- Dots rendered dynamically -->
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 20px;">
        <span class="keyboard-shortcut-hint">[← / →] Navigate · [Space] Listen</span>
        <span class="slide-counter" id="slide-counter">Slide 01 / 01</span>
      </div>
    </nav>
  </div>

  <!-- Presentation Deck Scripts -->
  <script src="js/three-bg.js"></script>
  <script src="js/api.js"></script>
  <script src="js/deck.js"></script>
</body>
</html>
